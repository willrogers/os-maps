repos:
  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]

  # Kotlin code style
  - repo: local
    hooks:
      - id: ktlint
        name: ktlint
        language: system
        entry: ./gradlew :app:ktlintFormat
        pass_filenames: false
        types: [kotlin]
